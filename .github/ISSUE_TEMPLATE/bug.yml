name: Bug / 问题反馈
description: 报告可复现的问题 / Report a reproducible problem
body:
  - type: markdown
    attributes:
      value: '请勿提交 API Key、Cookie、私人原文或未脱敏的请求日志。安全漏洞请使用仓库 Security 页的私密报告入口。 / Never include secrets or private text. Use a private security report for vulnerabilities.'
  - type: input
    id: version
    attributes:
      label: 插件和浏览器版本 / Extension and browser versions
      placeholder: v0.7.0; Chrome 156; macOS 15
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 功能 / Area
      options:
        - 独立翻译页 / Text translation
        - 划词翻译 / Selection translation
        - 网页双语 / Bilingual webpage
        - 朗读 / Speech
        - 配置或安装 / Settings or installation
        - 其他 / Other
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: 服务和模型 / Provider and model
      description: 仅填写名称，不要填写 Key 或包含凭据的地址。 / Names only, no credentials.
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 用公开网页或无隐私的示例文字说明。 / Use public pages or non-sensitive sample text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果 / Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 错误文字或截图 / Error message or screenshot
      description: 上传前遮盖凭据、私人内容与账号信息。 / Redact secrets and private information first.
