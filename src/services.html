<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>朗读声音 · 翻译</title><link rel="stylesheet" href="services.css"></head><body><div class="settings-shell"><header><a href="index.html" class="back">← 翻译</a><div class="heading"><span id="voice-mark" class="heading-mark" aria-hidden="true"></span><div><h1>朗读声音</h1><p>选择声音，按自己的节奏阅读。</p></div></div><span class="local-tag">凭据仅保存在本机</span></header><main><section class="settings-content"><div class="section-title"><h2 id="section-title">找到喜欢的声音</h2><p id="section-description">所选原文、译文和例句都用这个声音朗读。</p></div><form id="service-form"><div class="field"><label for="service-provider">服务</label><select id="service-provider"></select><p id="service-hint" class="field-hint"></p></div><div id="cloud-fields"><div class="field"><label for="service-key">API Key</label><div class="secret-wrap"><input id="service-key" type="password" autocomplete="off" placeholder="填写自己的 Key" maxlength="4096"><button type="button" id="reveal-key" aria-label="显示 Key"></button></div><p class="field-hint" id="key-hint">Key 只保存在当前浏览器，不会同步到云端。</p></div><div class="field"><label for="service-url">API 基础地址</label><input id="service-url" type="url" placeholder="https://api.example.com/v1" maxlength="512"><p class="field-hint">填写基础地址，插件会补全请求路径。本机服务可使用 HTTP。</p></div><div class="field"><label for="service-model">模型</label><input id="service-model" placeholder="填写模型名称" maxlength="128"></div><div id="protocol-field" class="field"><label for="service-protocol">接口类型</label><select id="service-protocol"></select></div><div id="voice-field" class="field"><label for="service-voice">音色 ID</label><input id="service-voice" list="voice-options" placeholder="MiniMax 留空时自动选择中英文声音" maxlength="512"><datalist id="voice-options"></datalist><p class="field-hint">可以填写平台自己的音色 ID，包括你已创建的音色。</p></div></div><div id="speed-field" class="field"><div class="range-label"><label for="service-speed">语速</label><output id="speed-value">1.0×</output></div><input id="service-speed" type="range" min="0.5" max="2" step="0.1" value="1"></div><div class="configuration-status" id="service-status" role="status"></div><footer><p id="test-note">测试会向所选服务发送一小段文字，使用该账号的额度。</p><div class="footer-buttons"><button type="button" id="test-service" class="secondary">试听声音</button><button type="submit" class="primary" id="save-service">保存设置</button></div></footer></form></section></main><p class="page-footnote">翻译与声音独立设置。只有主动朗读或试听时，才向语音服务发送文字。</p></div><script type="module" src="services.js"></script></body></html>
